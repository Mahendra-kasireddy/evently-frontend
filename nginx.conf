# Evently Web — production static serving (SPA).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip text assets (a CDN/edge may also handle this).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml font/woff2;

  # Hashed build assets are immutable — cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache the HTML shell, so new deploys are picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA history fallback — every unknown path serves index.html so
  # react-router can resolve it client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: reverse-proxy API calls to the backend so the browser talks to
  # one origin (avoids CORS, enables same-origin cookies). Uncomment and point
  # `upstream` at your API service.
  #
  # location /api/ {
  #   proxy_pass http://evently-api:3000;
  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   proxy_set_header X-Request-Id $request_id;
  # }
}
